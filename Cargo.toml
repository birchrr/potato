[package]
name = "potato"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "Make every Roblox client on your PC run light, RDP logins included, with settings per account."
repository = "https://github.com/birchrr/potato"

[dependencies]
serde_json = "1.0.154"

eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard"] }
sha2 = "0.11.1"
png = "0.18.1"
tiny-skia = "0.11"
ab_glyph = "0.2"

# eframe needs a window system on Linux; only the demo build (tests/window.rs) uses it there
[target."cfg(not(windows))".dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11"] }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
